###################################
# COSeg ablation config for ScanNetv2
# NOTE:
# 1) Fill DATA.data_root with your preprocessed ScanNet npy path
# 2) Fill Few-shot.pretrain_backbone with ScanNet backbone checkpoint path
###################################

DATA:
  data_name: scannetv2
  data_root: /root/autodl-tmp/COSeg/ScanNet/blocks_bs1_s1/data
  classes: 21
  fea_dim: 6
  voxel_size: 0.02
  voxel_max: 20480
  loop: 1
  cvfold: 1

TRAIN:
  arch: stratified_transformer
  stem_transformer: True
  use_xyz: True
  sync_bn: False
  rel_query: True
  rel_key: True
  rel_value: True
  quant_size: 0.01
  downsample_scale: 8
  num_layers: 4
  patch_size: 1
  window_size: 4
  depths: [2, 2, 6, 2]
  channels: [48, 96, 192, 384]
  num_heads: [3, 6, 12, 24]
  up_k: 3
  drop_path_rate: 0.3
  concat_xyz: True
  grid_size: 0.04
  max_batch_points: 140000
  max_num_neighbors: 34
  ratio: 0.25
  k: 16

  aug: True
  transformer_lr_scale: 0.1
  jitter_sigma: 0.005
  jitter_clip: 0.02
  scheduler_update: epoch
  scheduler: Poly
  warmup: linear
  warmup_iters: 1500
  warmup_ratio: 0.000001
  use_amp: True
  optimizer: AdamW
  ignore_label: 255
  train_gpu: [0]
  workers: 16
  base_lr: 0.00005
  freeze_backbone: False
  epochs: 50
  start_epoch: 0
  step_epoch: 3
  multiplier: 0.1
  momentum: 0.9
  weight_decay: 0.01
  drop_rate: 0.5
  manual_seed: 123
  proto_noise_std: 0.1
  dice_weight: 0.5
  feat_dropout_p: 0.2
  print_freq: 1
  save_freq: 1
  save_path: ./ablation_optimized
  weight:
  resume:
  evaluate: True
  eval_freq: 1

Few-shot:
  num_episode: 400
  n_way: 1
  k_shot: 1
  n_queries: 1
  num_episode_per_comb: 1000
  pretrain_backbone:
  n_subprototypes: 100
  vis: 0
  forvis: 0
  vis_save_path:
  target_class: table

Distributed:
  dist_url: tcp://127.0.0.1:6789
  dist_backend: 'nccl'
  multiprocessing_distributed: False
  world_size: 1
  rank: 0

TEST:
  test: False
  eval_split: val
